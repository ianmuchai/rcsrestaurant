<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00A800">
    <title>RC's | Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #0f172a;
            background: #f8fff7;
        }

        main {
            width: min(90vw, 420px);
            padding: 32px;
            text-align: center;
            border: 1px solid rgba(67, 171, 57, 0.18);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.84);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
        }

        img {
            width: 96px;
            height: 96px;
            margin-bottom: 18px;
            border-radius: 24px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #475569;
        }
    </style>
</head>

<body>
    <main>
        <img src="/images/pwa/icon-192.png" alt="RC's">
        <h1>You are offline</h1>
        <p>Please reconnect to continue browsing RC's menu and online ordering.</p>
    </main>
</body>

</html>
